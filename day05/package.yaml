# yaml-language-server: $schema=https://www.schemastore.org/any.json

name:                day05
version:             0.1.0.0
github:              "eatobin/day05"
license:             BSD-3-Clause
author:              "Eric Tobin"
maintainer:          "eatobin@gmail.com"
copyright:           "None"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            None

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/eatobin/day05#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- hspec
- split
- Cabal

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  day05-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
      - day05
    when:
      - condition: false
        other-modules: Paths_day05

tests:
  day05-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - day05
